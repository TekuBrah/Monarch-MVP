# Gate 22 — Netlify deploy configuration.
#
# Every value here was derived from this repo rather than assumed. Netlify was
# chosen deliberately over Vercel: Netlify Database is on the Free plan, and
# Vercel's Hobby plan restricts use to non-commercial personal projects.

[build]
  # `npm run build:package` = `tsc -b && node scripts/build-from-package.mjs`,
  # which spawns `vite build` with MONARCH_DS_FROM_PACKAGE=1.
  #
  # WHY NOT PLAIN `npm run build`. `vite.config.ts` aliases
  # `@monarch/design-system` to the sibling DS *source* whenever
  # `../Design system test/src` exists. On Netlify it does not, so plain
  # `npm run build` would take the package path *by accident* — correct today,
  # and silently dependent on a folder's absence. `build:package` forces the
  # package path explicitly, so the deploy compiles what the gates measured
  # rather than what the environment happened to leave out.
  command = "npm run build:package"

  # MEASURED, NOT ASSUMED. `vite.config.ts` declares no `build.outDir` and
  # `scripts/build-from-package.mjs` passes no `--outDir` (it only forwards
  # arguments it is given, and the npm script gives it none), so Vite's default
  # applies. Confirmed empirically: `dist/` was deleted, `npm run build:package`
  # was run, and `dist/` reappeared carrying index.html + assets/ + media/,
  # with Vite's own log lines prefixed `dist/`.
  publish = "dist"

[build.environment]
  # PINNED SO THE BUILD DOES NOT DRIFT WITH NETLIFY'S DEFAULT IMAGE.
  # Local toolchain at Gate 22: Node v24.17.0, npm 11.13.0. The major is what
  # is pinned; the patch floats so security updates still land.
  NODE_VERSION = "24"

# THE SPA REWRITE IS NOT OPTIONAL HERE, AND IT IS NOT BOILERPLATE.
#
# `src/main.tsx` mounts <BrowserRouter>, so every route is a real path, not a
# hash. `src/App.tsx` declares `finance/holding/:holdingId`, and the harness
# walks 9 concrete expansions of it — `/finance/holding/fd` is a URL a user can
# bookmark. `vite.config.ts` sets no `base`, so the built index.html references
# `/assets/…` absolutely and the app assumes the domain root.
#
# Without this rule, a direct link or a refresh on any non-root path asks
# Netlify's CDN for a file that does not exist and gets a 404 — the root URL
# would work and every deep link would not. Status 200 (not 301/302) so the
# URL the router reads is the one the user asked for.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Gate 24 — deploy hygiene.
# ---------------------------------------------------------------------------

# THE SPA REWRITE ABOVE IS WHY `robots.txt` HAD TO BE A REAL FILE, AND WHY IT
# WORKS. Before this gate, `GET /robots.txt` returned **200 with the app's
# HTML** — measured on the live deploy, `Content-Type: text/html`, 750 bytes —
# because the `/*` rule caught it. Most crawlers read that as "no robots.txt"
# and proceed to fetch the 5.75 MB bundle.
#
# `public/robots.txt` fixes it because Netlify serves a file that EXISTS in the
# publish directory BEFORE it applies a non-forced rewrite. That precedence is
# the whole mechanism, and it has one hazard: appending `!` to the redirect
# status (`200!`, a FORCED rewrite) inverts it, and `robots.txt` would silently
# start serving HTML again with nothing failing. Do not force that rule.

# X-Robots-Tag GOVERNS INDEXING; robots.txt GOVERNS FETCHING. They are not
# redundant, and neither replaces the other:
#
#   - a crawler that OBEYS robots.txt never fetches, so it never sees this
#     header — the header is for the ones that fetch anyway;
#   - a page blocked by robots.txt can still be INDEXED from inbound links
#     alone (the crawler indexes the URL without the content), and the only
#     thing that suppresses that is a noindex directive on a response the
#     crawler actually received.
#
# TEMPORARY, same as robots.txt — remove both together when the DS logo assets
# are fixed and the case study is ready to share.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# FRAMING IS DELIBERATELY LEFT OPEN — Gate 24, Phase 2. THIS IS A DECISION,
# NOT AN OVERSIGHT, and the absence of a policy here is the implementation of
# it.
#
# Teku intends a DS showcase page with an MVP tab that IFRAMES this deployed
# app inside a phone bezel, which requires this origin to permit framing.
# Measured on the live deploy at Gate 24: the response carries no
# `X-Frame-Options` and no `Content-Security-Policy`, so framing is permitted
# today BY DEFAULT rather than by decision. This comment is what converts it
# into a decision.
#
# DO NOT ADD `frame-ancestors` YET. The showcase origin does not exist, so any
# policy written now would be written against a guessed domain — and the
# failure mode is silent and badly timed: the iframe renders blank in the
# browser the day the showcase is demoed, with the block visible only in the
# console.
#
# WHEN THE SHOWCASE ORIGIN EXISTS, the correct change is exactly one header:
#
#   [[headers]]
#     for = "/*"
#     [headers.values]
#       Content-Security-Policy = "frame-ancestors 'self' https://<showcase-origin>"
#
# `frame-ancestors` and not `X-Frame-Options`, because the latter has no
# portable allow-list form — `ALLOW-FROM` was never implemented in Chromium and
# is dead. Add it only once the origin is known and can be typed literally.
