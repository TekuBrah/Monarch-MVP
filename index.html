<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Mobile-first viewport (roadmap D1: React DOM, mobile-first, PWA-installable).
      viewport-fit=cover exposes env(safe-area-inset-*) for notched devices.
      Pinch-zoom is deliberately NOT disabled — no maximum-scale / user-scalable=no,
      per the accessibility baseline in the design system's CLAUDE.md.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      theme_color and background_color are DERIVED, not picked. Both chains were
      resolved against the pinned DS (v1.15.0), not carried from an earlier gate:
        theme-color      --mapped-surface-primary-default -> --alias-primary-600
                         -> --brand-blue-600  #0358cc
        background_color --mapped-surface-page -> --alias-foundations-white
                         -> --brand-white      #ffffff
      The LIGHT value is the right one for background_color: a manifest carries
      one, it paints the splash before any CSS or JS runs, and ThemeProvider
      initialises to 'light' unconditionally.
      public/manifest.webmanifest is NOT scanned by scripts/check-tokens.mjs
      (SCAN_DIRS = ['src'], SCAN_FILES = ['index.html']), so its two hex values must
      be re-derived by hand across a DS upgrade. Nothing will report that they drifted.
      THIS FILE *IS* SCANNED — index.html is in SCAN_FILES — which is why the meta
      below carries a token-exempt marker and the manifest's identical value does not.

      THE VALUE BELOW IS THE STATIC ONE, AND SINCE GATE 44-B IT IS NOT THE ONLY ONE.
      Installed on Android, Chrome paints the status strip itself from this colour and
      grants the app no region beneath it, so a fixed blue strip sits above whatever
      the route actually renders. src/shell/useStatusBarColor.ts repaints it per route
      once the app is running — the header photograph's own colour on / and /finance,
      --mapped-surface-page everywhere else. That override is gated on
      (display-mode: standalone), so in a browser tab this value stands unchanged and
      is what tints Chrome's toolbar; it is also what paints the splash before any
      script runs, which is why it stays a real derived brand colour rather than
      becoming one of the two runtime values.
    -->
    <meta name="theme-color" content="#0358cc" /> <!-- token-exempt: manifest theme colour, mirrored from --mapped-surface-primary-default; a meta content attribute cannot hold a var() -->
    <!--
      BOTH spellings ship deliberately. MDN marks apple-mobile-web-app-capable
      deprecated in favour of the standard mobile-web-app-capable, but removing
      it has been reported to break iOS splash screens. iOS is the audience that
      matters most here, and Safari reads the apple-touch-icon link rather than
      the manifest's icons array for Add to Home Screen.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Monarch MVP</title>
    <!--
      GATE 87 — THE STORED THEME IS APPLIED BEFORE FIRST PAINT. A classic, blocking
      script, so it runs before the body paints and long before the bundle: the app
      renders only after hydrate() (up to 4 s, src/main.tsx), and without this a
      dark-mode tester would watch a light page for that whole wait. It restates
      src/theme/themePreference.ts in ES5 — validate against the value list, resolve,
      apply — because an HTML script cannot import a module. e2e/settings.spec.ts
      evaluates this exact script for every candidate stored value and asserts it
      agrees with resolveTheme(parseThemePreference(value)). Change one, change both.
      Storage can throw (blocked site data, some private modes): the catch leaves the
      page light, the default. No Content-Security-Policy is set (netlify.toml); one
      with script-src would have to carry this script's hash.
    -->
    <script>
      (function () {
        var preference = 'light'
        try {
          var stored = window.localStorage.getItem('monarch-mvp:theme')
          if (stored === 'light' || stored === 'dark') preference = stored
        } catch (e) {}
        var theme = preference === 'dark' ? 'dark' : 'light'
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
